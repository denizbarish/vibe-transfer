[package]
name = "vt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vibe-transfer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
indicatif = "0.18.6"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
vt-claude = { path = "../vt-claude" }
vt-core = { path = "../vt-core" }
vt-secrets = { path = "../vt-secrets" }

[dev-dependencies]
assert_cmd = "2.2.2"
blake3 = "1.8.7"
tempfile = "3.27.0"
