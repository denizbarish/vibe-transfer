name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  leak-check:
    runs-on: [self-hosted, vibe-ci]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Leak check
        run: scripts/leak-check.sh

  linux:
    runs-on: [self-hosted, vibe-ci]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # fmt, clippy and tests run inside the image; only `cargo fetch`
      # reaches the network.
      - name: Test container
        run: docker build -f Dockerfile.test .
